<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Supply — SATLOCK</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    /* Solo lo que la cáscara necesita y estilos.css no define.
       Todo lo demás sale de las clases fs- del archivo de estilos. */
    .fs-shell-aviso {
      margin: 12px 16px 0; padding: 10px 14px; border-radius: 8px;
      background: #FFF4E5; border: 1px solid #F0C070; color: #7A4E00;
      font-size: 13px;
    }
    .fs-shell-error {
      margin: 24px; padding: 16px 18px; border-radius: 8px;
      background: #FDECEC; border: 1px solid #E9A9A8; color: #8C1D1C;
      font-size: 13px; line-height: 1.5;
    }
    .fs-shell-error code { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .fs-shell-pendiente {
      margin: 40px auto; max-width: 520px; text-align: center;
      color: #667085; font-size: 14px; line-height: 1.6;
    }
    .fs-trm-pill {
      font-size: 12px; color: #475467; margin-right: 12px; white-space: nowrap;
    }
    .fs-trm-pill[data-alerta="si"] { color: #BA7517; font-weight: 600; }
  </style>
</head>
<body>

  <header class="fs-topbar">
    <span class="fs-topbar-title">SATLOCK</span>
    <span class="fs-badge-modulo">Fleet Supply</span>
    <span style="flex:1"></span>
    <span class="fs-trm-pill" id="fs-trm">TRM…</span>
    <span class="fs-user-pill" id="fs-usuario">…</span>
    <button class="fs-btn-logout" id="fs-salir" type="button">Salir</button>
  </header>

  <nav class="fs-tabs" id="fs-tabs"></nav>
  <div id="fs-aviso"></div>
  <main id="fs-contenido"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>

  <script type="module">
    import { iniciar, perfilActual, rolFSActual, cerrarSesion } from './js/auth.js';
    import { escapeHtml } from './js/ui.js';

    /* Cada pantalla se carga con import() dinámico y solo cuando se abre.
       Así el módulo arranca aunque un archivo esté roto o no exista: el
       error queda dentro de su pestaña en vez de dejar la página en blanco,
       que es exactamente lo que pasaba antes. */
    const PANTALLAS = [
      { id: 'tablero',       titulo: 'Tablero',       modulo: './js/tablero.js',       fn: 'renderTablero' },
      { id: 'negocios',      titulo: 'Negocios',      modulo: './js/negocios.js',      fn: 'renderNegocios' },
      { id: 'catalogo',      titulo: 'Catálogo',      modulo: './js/catalogo.js',      fn: 'renderCatalogo' },
      { id: 'combos',        titulo: 'Combos',        modulo: './js/catalogo.js',      fn: 'renderCombos' },
      { id: 'importar',      titulo: 'Importar',      modulo: './js/importador.js',    fn: 'renderImportador' },
      { id: 'inventario',    titulo: 'Inventario',    pendiente: 'La pantalla de inventario y recepción llega con la Fase 4B. Hoy el stock se consulta directamente en la tabla fs_stock.' },
      { id: 'compras',       titulo: 'Compras',       modulo: './js/compras.js',       fn: 'renderCompras' },
      { id: 'cronograma',    titulo: 'Cronograma',    pendiente: 'El cronograma encadenado y el Gantt llegan con la Fase 4B.' },
      { id: 'finanzas',      titulo: 'Finanzas',      pendiente: 'El panel financiero y las alertas de abastecimiento llegan con la Fase 4C.' },
      { id: 'configuracion', titulo: 'Configuración', modulo: './js/configuracion.js', fn: 'renderConfiguracion' },
    ];

    const POR_DEFECTO = 'tablero';
    const tabs = document.getElementById('fs-tabs');
    const contenido = document.getElementById('fs-contenido');
    const paneles = new Map();

    function construirNavegacion() {
      PANTALLAS.forEach((p) => {
        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'fs-tab';
        boton.dataset.pantalla = p.id;
        boton.textContent = p.titulo;
        boton.addEventListener('click', () => { location.hash = p.id; });
        tabs.appendChild(boton);

        const panel = document.createElement('section');
        panel.className = 'fs-panel';
        panel.id = `panel-${p.id}`;
        contenido.appendChild(panel);
        paneles.set(p.id, panel);
      });
    }

    function marcarActiva(id) {
      tabs.querySelectorAll('.fs-tab').forEach((t) => {
        t.classList.toggle('active', t.dataset.pantalla === id);
      });
      paneles.forEach((panel, clave) => {
        panel.classList.toggle('active', clave === id);
      });
    }

    async function abrir(id) {
      const pantalla = PANTALLAS.find((p) => p.id === id) || PANTALLAS[0];
      marcarActiva(pantalla.id);

      const panel = paneles.get(pantalla.id);

      if (pantalla.pendiente) {
        panel.innerHTML = `<div class="fs-shell-pendiente">${escapeHtml(pantalla.pendiente)}</div>`;
        return;
      }

      // Se vuelve a pintar en cada visita a propósito: los datos cambian
      // mientras se navega y una pantalla congelada engaña más que una
      // que tarda medio segundo.
      panel.innerHTML = '<div class="fs-loading">Cargando…</div>';

      try {
        const mod = await import(pantalla.modulo);
        const render = mod[pantalla.fn];
        if (typeof render !== 'function') {
          throw new Error(`El módulo no expone ${pantalla.fn}().`);
        }
        await render(panel);
      } catch (err) {
        console.error(`[Fleet Supply] Falló la pantalla "${pantalla.id}"`, err);
        panel.innerHTML = `
          <div class="fs-shell-error">
            <strong>No se pudo cargar la pantalla «${escapeHtml(pantalla.titulo)}».</strong><br>
            <code>${escapeHtml(err && err.message ? err.message : String(err))}</code><br><br>
            Archivo: <code>${escapeHtml(pantalla.modulo)}</code>.
            El detalle completo está en la consola del navegador.
          </div>`;
      }
    }

    function enrutar() {
      const id = (location.hash || '').replace('#', '') || POR_DEFECTO;
      abrir(PANTALLAS.some((p) => p.id === id) ? id : POR_DEFECTO);
    }

    /* La TRM se muestra en la barra superior, siempre con su procedencia.
       Una TRM sin origen visible es la forma más fácil de costear mal un
       negocio sin que nadie se entere. */
    async function pintarTRM() {
      const pill = document.getElementById('fs-trm');
      try {
        const { obtenerTRM, etiquetaOrigenTRM } = await import('./js/trm.js');
        const info = await obtenerTRM();
        pill.textContent = etiquetaOrigenTRM(info);
        pill.dataset.alerta = info.aviso ? 'si' : 'no';
        if (info.aviso) {
          document.getElementById('fs-aviso').innerHTML =
            `<div class="fs-shell-aviso">${escapeHtml(info.aviso)}</div>`;
        }
      } catch (err) {
        console.error('[Fleet Supply] TRM', err);
        pill.textContent = 'TRM no disponible';
        pill.dataset.alerta = 'si';
      }
    }

    async function arrancar() {
      try {
        await iniciar();
      } catch (err) {
        console.error('[Fleet Supply] Sesión', err);
        document.body.innerHTML =
          `<div class="fs-shell-error">No se pudo iniciar la sesión.<br>
           <code>${escapeHtml(err && err.message ? err.message : String(err))}</code></div>`;
        return;
      }

      const perfil = perfilActual();
      const rol = rolFSActual();
      document.getElementById('fs-usuario').textContent =
        `${perfil?.nombre || perfil?.email || 'Usuario'}${rol ? ` · ${rol}` : ''}`;

      document.getElementById('fs-salir')
        .addEventListener('click', () => cerrarSesion());

      construirNavegacion();
      window.addEventListener('hashchange', enrutar);
      enrutar();
      pintarTRM();
    }

    arrancar();
  </script>
</body>
</html>
